  embed_server:
    dim: 1024
    model: BAAI/bge-m3

  k8s:
    server: http://10.10.2.100:20080
    username: lill
    password: Luis19970901..
    cluster_id: 1uPI2zIKAJq
    skip_tls_verify: true

