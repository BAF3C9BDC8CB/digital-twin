# ═══════════════════════════════════════════════════════════════════════════
# Digital Twin 配置文件
# ═══════════════════════════════════════════════════════════════════════════
#
# 路径： ~/.config/opencode/skills/digital-twin/config.yaml
# 版本： dt >= 3.1.0
# 应用： dt 工具链的所有子命令均读取本文件
#
# ═══════════════════════════════════════════════════════════════════════════
# 整体流程
# ═══════════════════════════════════════════════════════════════════════════
#
#   dt build --path <path> --name <name>
#     │
#     ├─ 1. 扫描 projects[].path 目录，发现所有源码文件
#     ├─ 2. 并行 SHA1 计算 + SQLite 比对 → 找出变更文件
#     ├─ 3. tree-sitter AST 解析 → 提取方法、类、调用关系
#     ├─ 4. BGE-M3 嵌入 → 文本 → 1024 维向量（services.embed_server）
#     ├─ 5. Qdrant 写入向量 + Neo4j 写入知识图谱节点
#     └─ 6. 更新 SQLite 快照 + 重建 [:CALLS] 调用图
#
#   dt build-all
#     │
#     └─ 遍历 projects[]. 逐项执行 dt build（增量模式，只处理变更文件）
#
#   存储层：
#     Neo4j  (services.neo4j)    → 知识图谱   Method / Class / Project / [:CALLS]
#     Qdrant (services.qdrant)   → 向量库     {project}_methods 集合, Cosine/HNSW
#     SQLite (/var/lib/digital-twin/lazy.db) → 文件快照  SHA1 + mtime 变更检测
#     Embed  (services.embed_server) → 文本向量化  BGE-M3 1024 维
#
# ═══════════════════════════════════════════════════════════════════════════
# 常用命令
# ═══════════════════════════════════════════════════════════════════════════
#
#   增量构建全部：      dt build-all
#   全量重建全部：      dt build-all --full
#   构建指定项目：      dt build-all --filter "proj1,proj2"
#   单项目增量：        dt build --path <path> --name <name>
#   单项目全量：        dt index --path <path> --name <name>
#   单文件更新：        dt update --path <path> --name <name> --file <rel_path>
#   删除项目数据：      dt remove --project <name> --all
#   语义搜索代码：      dt search "关键词" --project <name>
#   语义搜索知识图谱：  dt search-kg "关键词"
#   健康检查：          dt health
#   项目列表：          dt list [--all] [--filter <name>]
#   同步 Nacos 配置：   dt nacos-sync --env test
#   同步 K8s 资源：     dt k8s-sync
#
# ═══════════════════════════════════════════════════════════════════════════
# 增删项目流程
# ═══════════════════════════════════════════════════════════════════════════
#
#   添加新项目：
#     在 projects 下对应 base 中添加一行项目名即可
#     dt build-all --filter "新项目名"
#
#   删除项目：
#     dt remove --project <name> --all
#     从 projects 中移除对应行
#
# ═══════════════════════════════════════════════════════════════════════════

# ── 服务器信息 ─────────────────────────────────────────────────────────────
