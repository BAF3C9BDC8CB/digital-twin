server:
  hostname: MiWiFi-CR8819-srv
services:
  embed_server:
    dim: 768
    model: BAAI/bge-base-zh-v1.5
    url: http://localhost:8001
  neo4j:
    password: neo4j
    url: http://localhost:7474
    user: neo4j
  qdrant:
