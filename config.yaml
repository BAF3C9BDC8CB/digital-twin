snapshot_dir: /var/lib/digital-twin/snapshots
watcher:
  debounce_seconds: 30
  ignore_dirs:
  - node_modules
  - .git
  - __pycache__
  - venv
  - dist
  - build
  - target
  - .idea
  - vendor
  - logs
  - log
  - .gradle
  max_files_per_batch: 20
  watch_extensions:
  - .java
  - .php
  - .ts
  - .tsx
  - .py
  - .go
  - .rs
  - .js
  - .jsx
  - .vue
  - .xml
  - .yml
  - .yaml
  - .properties
  - .md
  - .txt
