# ===========================================================================
# digital-twin 流水线配置（config/pipeline.yaml）
#
# 2026-09-06 起：多厂商 × 多模型端点池。
#   providers.{llm,embed,rerank}   —— 各能力一个端点池；一个端点 =
#      url + api_key + 一个模型。池内失败自动顺延下一端点：
#      某 key 欠费/被限、某网关挂掉、某模型不可用 → 自动切换，不整批失败。
#   多 key 并行（2026-09-06 默认开启）：
#     池内多个端点 = 多个 key 同时工作。每个端点独立并发槽（各自
#     max_concurrent，互不占用），整池在飞请求 = 各端点之和——
#     LLM 池 48×N、embed 池同理，跨 key 横向扩展吞吐。
#   llm / embed / rerank           —— 顶层块放「默认模型 + 推理参数」，
#      端点级 model 缺省时用顶层默认。
#
# 密钥红线：api_key 直填或 api_key_env 引环境变量；解析期校验缺失即报错。
# ===========================================================================

# ---------------------------------------------------------------------------
# 各处理阶段开关
# ---------------------------------------------------------------------------
processors:
  tree_sitter: true     # AST 解析（代码实体抽取）
  llm: true             # LLM 分析（方法/文档语义分析）
  chunk: true           # 文本分块
  extract_text: true    # 纯文本 / Markdown 抽取
  ocr: false            # OCR（默认关，需额外依赖）
  store: true           # 结果写入图 + 向量库
  embed: true           # 向量化（Qdrant 已有向量时可关）

# ---------------------------------------------------------------------------
# 文档分级门控（doc-gate）：用 LLM 判定文档价值，决定是否做详细提取
#   enabled=false（默认）→ 所有文档一律详细提取（实体+关系，现状行为）
# ---------------------------------------------------------------------------
doc_gate:
  enabled: false
  preview_chars: 4000
  fallback: high

# ---------------------------------------------------------------------------
# providers —— 按能力划分的端点池
#   strategy: round_robin（轮询均分，多 key 并行，默认）| failover（顺序主备）
#     · round_robin —— 并发请求轮流发到不同端点/key，同时利用全部额度
#       （2026-09-06 起默认；端点 weight 可调流量比例，缺省 1=均分）。
#       失败端点自动顺延/绕过，单点故障不拖垮整池。
#     · failover —— 固定顺序主备：同一时刻只用一个端点（一次只能用一个
#       key），仅当它失败才切下一个。旧语义，保留给不想并行的场景。
#   proxy:    全局默认代理（端点级 proxy 可覆盖；false = 直连，缺省）
#
# 每个端点字段：
#   name            显示名（日志/健康报告，缺省取 url host）
#   url             OpenAI 兼容 base URL（必填）
#   api_key / api_key_env 二选一（都空 → 解析期报错）
#   model           该端点使用的模型（必填；不同端点不同模型即多模型 failover）
#   max_concurrent  端点并发上限（可选；缺省 20）。多个端点=多个 key，
#                   整池总并发是各端点之和（例：4 端点×48 = 192 在飞）。
#   weight          仅 round_robin 生效：流量比例（缺省 1=均分）
#   proxy           端点级代理覆盖（可选）
#
# 注意：
#   - embed 池内模型输出维度必须一致（Qdrant collection 维度固定）。
#   - rerank 走 /rerank 私有端点（SiliconFlow 兼容网关专属）。
#   - embed batch 不会跨端点拆分：一批必整批落同一端点。
# ---------------------------------------------------------------------------
providers:
  strategy: round_robin
  proxy:
    enabled: false
    url: http://127.0.0.1:7897

  # ── LLM 池（多厂商 × 多模型）─────────────────────────────────────
  # 顺序即 failover 优先级：第一个是主，失败自动顺延下一个。
  llm:
    - name: sf-deepseek-r1
      url: http://124.221.200.116:3000/v1
      api_key: sk-QX1S2IcSdKGEGHmvFksiEBGPOS4J0uvZTM1gGiVg1xm0UT0i              # ← 填入 SF 通道真实 key（sk-QX… 开头）
      model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
      max_concurrent: 48
    # ── 阿里/聚合通道（同网关，另一个 key，13 个模型）──
    - name: ali-qwen3.7-flash
      url: http://124.221.200.116:3000/v1
      api_key: sk-nGcfETaEBF5VB6Eblp7AXdTcm2P2xahAS2ZUYH98LpLYGNxy
      model: qwen3.7-flash
      max_concurrent: 48
    - name: ali-qwen3.7-max-2026-06-08
      url: http://124.221.200.116:3000/v1
      api_key: sk-nGcfETaEBF5VB6Eblp7AXdTcm2P2xahAS2ZUYH98LpLYGNxy
      model: qwen3.7-max-2026-06-08
      max_concurrent: 48
    - name: ali-qwen3.8-flash
      url: http://124.221.200.116:3000/v1
      api_key: sk-nGcfETaEBF5VB6Eblp7AXdTcm2P2xahAS2ZUYH98LpLYGNxy
      model: qwen3.8-flash
      max_concurrent: 48
    - name: ali-deepseek-v4-flash-0731
      url: http://124.221.200.116:3000/v1
      api_key: sk-nGcfETaEBF5VB6Eblp7AXdTcm2P2xahAS2ZUYH98LpLYGNxy
      model: deepseek-v4-flash-0731
      max_concurrent: 48
    - name: ali-glm-5.2
      url: http://124.221.200.116:3000/v1
      api_key: sk-nGcfETaEBF5VB6Eblp7AXdTcm2P2xahAS2ZUYH98LpLYGNxy
      model: glm-5.2
      max_concurrent: 48
    - name: ali-kimi-k2.7-code
      url: http://124.221.200.116:3000/v1
      api_key: sk-nGcfETaEBF5VB6Eblp7AXdTcm2P2xahAS2ZUYH98LpLYGNxy
      model: kimi-k2.7-code
      max_concurrent: 48
    - name: ali-deepseek-v4-pro-0813
      url: http://124.221.200.116:3000/v1
      api_key: sk-nGcfETaEBF5VB6Eblp7AXdTcm2P2xahAS2ZUYH98LpLYGNxy
      model: deepseek-v4-pro-0813
      max_concurrent: 48
    - name: ali-qwen3.8-2.4t-a95b
      url: http://124.221.200.116:3000/v1
      api_key: sk-nGcfETaEBF5VB6Eblp7AXdTcm2P2xahAS2ZUYH98LpLYGNxy
      model: qwen3.8-2.4t-a95b
      max_concurrent: 48
    - name: ali-qwen3.8-max
      url: http://124.221.200.116:3000/v1
      api_key: sk-nGcfETaEBF5VB6Eblp7AXdTcm2P2xahAS2ZUYH98LpLYGNxy
      model: qwen3.8-max
      max_concurrent: 48

  # ── Embed 池（必须同维；默认模型见 embed.model）──────────────────
  embed:
    - name: internal-gw
      url: http://124.221.200.116:3000/v1
      api_key: sk-QX1S2IcSdKGEGHmvFksiEBGPOS4J0uvZTM1gGiVg1xm0UT0i              # ← embed/rerank 用 SF 通道 key（bge-m3 在该通道）
      max_concurrent: 8

  # ── Rerank 池（必须支持 /rerank 私有端点）────────────────────────
  rerank:
    - name: internal-gw
      url: http://124.221.200.116:3000/v1
      api_key: sk-QX1S2IcSdKGEGHmvFksiEBGPOS4J0uvZTM1gGiVg1xm0UT0i
      max_concurrent: 4

# ---------------------------------------------------------------------------
# LLM 能力（代码分析 / 文档抽取 / 路由过滤共用）
#   model:    默认 LLM 模型（端点级 model 缺省时使用）
#   max_tokens: 单次回复上限（8B 推理模型需长输出，保持 4096）。
# ---------------------------------------------------------------------------
llm:
  model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
  temperature: 0.1
  max_tokens: 4096

# ---------------------------------------------------------------------------
# Embed 能力（向量化）
# ---------------------------------------------------------------------------
embed:
  model: BAAI/bge-m3

# ---------------------------------------------------------------------------
# Rerank 能力（检索结果重排）
# ---------------------------------------------------------------------------
rerank:
  model: BAAI/bge-reranker-v2-m3

# ---------------------------------------------------------------------------
# KG Router（dt router 三级路由）
# ---------------------------------------------------------------------------
kg_router:
  early_exit:
    enabled: true
  llm_gate:
    enabled: false
    max_tokens: 120
    temperature: 0.0
  result_filter:
    enabled: true
    threshold: 0.6
