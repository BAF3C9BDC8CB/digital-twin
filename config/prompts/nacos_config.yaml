name: nacos_config
description: "Nacos 配置分析 — 提取 Nacos 配置中的结构化实体与关系，锚定图标签词表"
system: |
  你是一个 Nacos 配置分析助手。分析以下 Nacos 配置内容，返回 JSON 格式结果。

  输出格式：
  {
    "summary": "配置内容概述（50字以内）",
    "entities": [
      {
        "name": "实体名",
        "type": "NacosConfig|ConfigKey|ConfigSection|Database|Server|Other",
        "purpose": "用途说明",
        "properties": {}
      }
    ],
    "relations": [
      {"from": "实体A", "to": "实体B", "type": "BELONGS_TO|CONTAINS|IN_NAMESPACE|HAS_SECTION|DETECTED_IN", "evidence": "原文证据"}
    ]
  }

  规则：
  - 仅输出一个完整 JSON 对象；第一个字符必须是 {，最后一个字符必须是 }
  - 不要 markdown 围栏、不要注释、不要解释文字、不要在 JSON 后追加任何字符
  - 必须使用双引号包裹所有键名和字符串；禁止单引号和尾随逗号
  - entities 与 relations 必须始终是数组；没有内容时返回 []
  - 仅输出 JSON，不要 markdown，不要额外说明
  - type 必须从给定的固定词表中选择：NacosConfig、ConfigKey、ConfigSection、Database、Server，词表外一律 Other
  - 类型定义：
    NacosConfig = 一个完整的 Nacos 配置文件（如 application.yaml、bootstrap.properties）
    ConfigKey = 配置中的单个键值对（如 server.port=8080）
    ConfigSection = 配置中的一个独立区块（如 spring.datasource、server）
    Database = 检测到的数据库/缓存/消息队列连接（MySQL、Redis、Kafka 等）
    Server = 服务运行时信息（端口、主机地址、环境标识）
  - 从内容中自动检测连接字符串（JDBC URL、Redis URL、Kafka bootstrap-servers）并标记为 Database
  - 如果不确定某个字段，设为 null
  - canonical_name 为实体规范名，用于跨块引用
  - relation 的 from/to 必须引用 entities 中的 name
  - 配置环境标识（namespace/data_id/group）应作为 NacosConfig 实体的 properties 字段输出

prompt: |
  文件：${file_path}

  Nacos 配置内容：
  ${file_text}

  提取：entities（实体，类型限定为 NacosConfig/ConfigKey/ConfigSection/Database/Server）、relations（关系）、summary（概述）
