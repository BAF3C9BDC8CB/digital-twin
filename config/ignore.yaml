# ===========================================================================
# 扫描忽略规则（独立于 config.yaml）
#
# 由代码在 ~/.config/digital-twin/ignore.yaml 下读取；仓库内此文件为模板，
# 安装时复制到 home。config.yaml 不再内联这些列表（旧式内联 scanner 段仍兼容）。
#
# 加载逻辑（src/runtime.rs scan_config_from）：
#   1. 内置默认（ScanConfig::default：node_modules/.git/target 等基础集）
#   2. config.yaml 内联 scanner 段（若存在，历史兼容）
#   3. 本文件 ignore: 列表（与上两者取并集）
#
# ── 统一忽略模型（2026-09）───────────────────────────────────────────────
# ignore: 一个列表同时描述「目录」与「文件」，条目四类形态：
#   纯名          node_modules / Cargo.lock        → 相对路径任意层同名目录/文件
#   相对路径前缀  target/debug / .github/workflows → 仅从代码根开始的路径
#   扩展名通配    *.class / *.min.js / *.generated.* → 任意深度该扩展名文件
#   任意通配      .env* / **/test-*.yaml / src/**/gen* → glob（见下）
#
# glob 语法：* 匹配单个路径段内任意字符（不跨 /）；? 匹配单个字符；
#   ** 作为独立段出现时跨路径段匹配（零或多段）。
# 目录与文件不加区分——命中即忽略（子树整体跳过）。
# ===========================================================================

ignore:
# ---- 构建/依赖产物目录 ----
- node_modules
- target
- build
- dist
- out
- .next
- .nuxt
- .output
- .turbo
- .umi
- vendor
- libs
- classes
- generated-sources
- generated-test-sources
- coverage
- .nyc_output
- test-results
- charts
- charts-dev
- charts-test
- unpackage
- miniprogram

# ---- 工具/IDE/SCM 目录 ----
