[package]
name = "dt-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dt"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Date / time
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# Logging utilities
parking_lot = "0.12"
once_cell = "1.20"
uuid = { version = "1", features = ["v4"] }

# SQLite for snapshot storage
rusqlite = { version = "0.32", features = ["bundled"] }

# File scanning
walkdir = "2"

# Regex
regex = "1"

# Tree-sitter AST parsing
tree-sitter = "0.25"
tree-sitter-java = "0.23"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-php = "0.24"

# Bolt protocol driver (Memgraph-compatible, wraps neo4rs crate)
bolt-driver = { package = "neo4rs", version = "0.8", features = ["json"] }

# Hashing
sha2 = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }

# Concurrent map
dashmap = "6"

# Async streams
futures = "0.3"

# File system watcher
notify = "7"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Encoding
base64 = "0.22"
hex = "0.4"

# Compression
flate2 = "1.0"

# Qdrant gRPC client
qdrant-client = "1"

[dev-dependencies]
tempfile = "3"
