// 本地服务插件 gRPC 服务 — 微服务生命周期管理。
syntax = "proto3";

package dt.plugin.svc;

import "common.proto";

service SvcPlugin {
  // 列出所有受管的本地微服务。
  rpc ListServices(dt.common.Empty) returns (ListServicesResponse);

  // 获取单个服务的详细状态。
  rpc GetStatus(GetStatusRequest) returns (ServiceStatus);

  // 启动服务（服务端流式返回构建 + 启动输出）。
  rpc Start(StartRequest) returns (stream ServiceLogLine);

  // 停止服务。
  rpc Stop(StopRequest) returns (ServiceStatus);

  // 重启服务（服务端流式，同上）。
  rpc Restart(RestartRequest) returns (stream ServiceLogLine);

  // 流式获取服务日志（类似 tail -f）。
  rpc GetLogs(GetLogsRequest) returns (stream ServiceLogLine);
}

message GetStatusRequest {
  string name = 1;
}

message StartRequest {
  string name = 1;
}

message StopRequest {
  string name = 1;
}

message RestartRequest {
  string name = 1;
}

message GetLogsRequest {
  string name = 1;
  int32 lines = 2;  // 初始尾部行数
}

message ServiceInfo {
  string name = 1;
  string status = 2;   // 取值：running / stopped / error
  int32 pid = 3;
  string port = 4;
  string uptime = 5;
}

message ListServicesResponse {
  repeated ServiceInfo services = 1;
}

message ServiceStatus {
  string name = 1;
  string status = 2;
  int32 pid = 3;
  string port = 4;
  string uptime = 5;
  string last_error = 6;
}

message ServiceLogLine {
  string timestamp = 1;
  string level = 2;
  string content = 3;
  string service = 4;
}
