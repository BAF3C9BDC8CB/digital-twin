syntax = "proto3";

package dt.log;

import "common.proto";

// LogService — 统一日志接入与查询。
//
// 所有组件（Rust 守护进程、Python MCP 服务器、embed 服务器）都通过此服务
// 发送日志。守护进程将所有日志聚合到单个 JSON-lines 文件中。
service LogService {
    // StreamLogs 接收客户端流式发送的日志条目。
    // 服务端在每个批次后返回确认。
    rpc StreamLogs(stream LogEntry) returns (LogAck);

    // QueryLogs 查询历史日志（服务端过滤 + 分页）。
    rpc QueryLogs(LogQuery) returns (stream LogEntry);
}

// 任意组件产生的一条日志条目。
message LogEntry {
    string timestamp = 1;           // RFC3339 格式，含毫秒
    string level = 2;               // 日志级别：TRACE|DEBUG|INFO|WARN|ERROR
    string target = 3;              // 来源模块，例如 "dt::build"
    string trace_id = 4;            // 跨进程追踪 ID
    string span_id = 5;             // 父级 span ID
    string plugin = 6;              // 插件名（core 为空）
    string message = 7;             // 日志消息
    string error = 8;               // 错误详情（JSON，可选）
    map<string, string> fields = 9; // 业务相关的键值对
}

// 流式接入后服务端返回的确认。
message LogAck {
    int32 received = 1;             // 已接受的条目数
    string error = 2;               // 错误消息（为空表示成功）
}

// 历史日志查询参数。
message LogQuery {
    string start_time = 1;          // RFC3339 下界（含）
    string end_time = 2;            // RFC3339 上界（不含）
    repeated string levels = 3;     // 按级别过滤
    string target = 4;              // 按 target 过滤（子串匹配）
    string trace_id = 5;            // 按 trace ID 过滤
    string plugin = 6;              // 按插件过滤
    string query = 7;               // 在消息中全文搜索
    int32 limit = 8;                // 最多返回的条目数（默认 100）
    int32 offset = 9;               // 分页偏移
}
