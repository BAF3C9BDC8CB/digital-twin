syntax = "proto3";

package dt.metrics;

// MetricsService — 内部指标采集（无 HTTP 端口）。
//
// 通过 `GetMetrics` 提供时间点快照，通过 `WatchMetrics` 提供周期性
// 轮询（服务端流式）。
service MetricsService {
    // 获取所有已注册指标的时间点快照。
    rpc GetMetrics(MetricsRequest) returns (MetricsResponse);

    // Watch 按固定间隔接收指标快照（默认 5 秒）。
    rpc WatchMetrics(MetricsRequest) returns (stream MetricSnapshot);
}

// 请求参数。
message MetricsRequest {
    int32 interval_secs = 1;    // 用于 WatchMetrics：快照间隔（默认 5）
    string filter = 2;          // 可选的指标名前缀过滤
}

// 包含完整快照的响应。
message MetricsResponse {
    string timestamp = 1;
    map<string, double> gauges = 2;
    map<string, double> counters = 3;
    map<string, Histogram> histograms = 4;
}

// 单个指标快照（也用于流式）。
message MetricSnapshot {
    string timestamp = 1;
    map<string, double> gauges = 2;
    map<string, double> counters = 3;
    map<string, Histogram> histograms = 4;
}

// Histogram 桶数据。
message Histogram {
    uint64 count = 1;
    double sum = 2;
    repeated double bounds = 3;     // 桶上界
    repeated uint64 bucket_counts = 4;
}
