syntax = "proto3";

package dt.core;

import "common.proto";

// Digital Twin Core gRPC 服务 — dt CLI 操作。
service DtCore {
  // 构建 / 索引项目或文件到向量库。
  rpc Build(BuildRequest) returns (BuildResponse);

  // 语义代码搜索。
  rpc Search(SearchRequest) returns (SearchResponse);

  // 记录事件（部署、安装、配置变更等）。
  rpc RecordEvent(EventRequest) returns (dt.common.Empty);

  // 记忆知识（决策、笔记、依赖）。
  rpc Memorize(MemorizeRequest) returns (dt.common.Empty);

  // 同步知识图谱节点到向量库。
  rpc Sync(SyncRequest) returns (SyncResponse);
}

// ---- 构建 ----

message BuildRequest {
  string path = 1;
  string name = 2;   // 可选的项目名
  bool is_file = 3;  // path 为单个文件时为 true
}

message BuildResponse {
  int32 files_indexed = 1;
  int32 vectors_created = 2;
  int32 files_skipped = 3;
  double elapsed_secs = 4;
}

// ---- 搜索 ----

message SearchRequest {
  string query = 1;
  int32 limit = 2;
  bool expand = 3;   // 已忽略（历史遗留）
  string path = 4;   // 已忽略（历史遗留）
  string project = 5;
  string world = 6;        // all|code|knowledge|doc|config|memory；空=all
  uint32 max_hops = 7;     // knowledge 世界图扩展跳数；0=默认1
  bool with_evidence = 8;  // knowledge top-5 证据回填
  string origin = 9;       // knowledge 召回 origin 过滤
  string doc_id = 10;      // doc 世界单文档限定
}

message ScoreBreakdown {
  double semantic = 1;
  double rerank = 2;
  double graph_boost = 3;
  double final_score = 4;
}

message RelationSnippet {
  string rel_type = 1;
  string other_end_id = 2;
  string other_end_name = 3;
  string direction = 4;
  double confidence = 5;
  string evidence = 6;
  int32 supplementary_count = 7;
}

message SearchResult {
  float score = 1;
  string name = 2;
  string file_path = 3;
  int32 start_line = 4;
  string signature = 5;
  string entity_type = 6;
  string snippet = 7;
  string llm_analysis = 8;
  int32 end_line = 9;
  uint32 hop = 10;
  bool rerank_degraded = 11;
  repeated string evidence = 12;
  ScoreBreakdown score_breakdown = 13;
  repeated RelationSnippet relations = 14;
}

message SearchResponse {
  repeated SearchResult results = 1;
  int32 total = 2;
  double elapsed_secs = 3;
}

// ---- 事件 ----

message EventRequest {
  string type = 1;          // 取值：Deploy / SoftwareInstalled / ConfigChange / Conversation
  string entity_id = 2;
  string entity_type = 3;
  string project = 4;
  string details = 5;
}

// ---- 记忆 ----

message MemorizeRequest {
  string type = 1;          // 取值：Decision / KnowledgeAdded / Environment / Dependencies
  string entity_id = 2;
  string entity_type = 3;
  string project = 4;
  string details = 5;
}

// ---- 同步 ----

message SyncRequest {
  bool incremental = 1;
  repeated string labels = 2;
}

message SyncResponse {
  int32 nodes_synced = 1;
  int32 nodes_skipped = 2;
  double elapsed_secs = 3;
}
