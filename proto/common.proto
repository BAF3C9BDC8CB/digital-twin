// Digital Twin 所有 proto 定义共用的通用类型。
syntax = "proto3";

package dt.common;

// 健康状态枚举，与 dt-common::types::HealthStatus 对应。
enum HealthStatus {
  HEALTHY = 0;
  DEGRADED = 1;
  UNHEALTHY = 2;
}

// 通用错误消息。
message Error {
  string code = 1;
  string message = 2;
}

// 用于无输入或输出的 RPC 的空消息。
message Empty {}

// 通用键值对。
message KeyValue {
  string key = 1;
  string value = 2;
}
