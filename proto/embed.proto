// 向量化服务 — 文本 → 向量转换。
syntax = "proto3";

package dt.embed;

import "common.proto";

service EmbedService {
  // 为一个或多个文本生成向量。
  rpc Embed(EmbedRequest) returns (EmbedResponse);

  // 健康检查。
  rpc Health(dt.common.Empty) returns (dt.common.Empty);
}

message EmbedRequest {
  repeated string texts = 1;
  string model = 2;  // 可选的模型覆盖
}

message Embedding {
  repeated float vector = 1;
}

message EmbedResponse {
  repeated Embedding embeddings = 1;
  string model_used = 2;
}
