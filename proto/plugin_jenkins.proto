// Jenkins plugin gRPC service — CI/CD operations.
syntax = "proto3";

package dt.plugin.jenkins;

import "common.proto";

service JenkinsPlugin {
  // List all Jenkins jobs.
  rpc ListJobs(dt.common.Empty) returns (ListJobsResponse);

  // Get parameter definitions for a job.
  rpc GetParams(GetParamsRequest) returns (GetParamsResponse);

  // Get build history for a job.
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);

  // Trigger a build (server-side streaming for console output).
  rpc Build(BuildRequest) returns (stream BuildOutput);

  // Get build log for a completed build.
  rpc GetBuildLog(GetBuildLogRequest) returns (GetBuildLogResponse);
}

message JobInfo {
  string name = 1;
  string url = 2;
  string color = 3;  // Jenkins job status color
}

message ListJobsResponse {
  repeated JobInfo jobs = 1;
}

message GetParamsRequest {
  string job = 1;
}

message ParamInfo {
  string name = 1;
  string description = 2;
  string default_value = 3;
  string type = 4;
}

message GetParamsResponse {
  repeated ParamInfo params = 1;
}

message GetHistoryRequest {
  string job = 1;
  int32 limit = 2;
}

message BuildHistoryEntry {
  int32 number = 1;
  string result = 2;
  string timestamp = 3;
  string duration = 4;
}

message GetHistoryResponse {
  repeated BuildHistoryEntry entries = 1;
}

message BuildRequest {
  string job = 1;
  repeated dt.common.KeyValue params = 2;
  string env = 3;  // "test" or "production"
}

message BuildOutput {
  string stream = 1;   // e.g. "stdout", "stderr", "status"
  string content = 2;
  string timestamp = 3;
}

message GetBuildLogRequest {
  string job = 1;
  int32 build = 2;  // build number; latest if omitted
}

message GetBuildLogResponse {
  string log = 1;
  int32 build_number = 2;
}
